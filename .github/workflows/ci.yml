# Runs the full test suite (including the PostgreSQL tests) and checks the migrations match the models.
# NOTE: written but not executed on the development machine.
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt alembic
      - run: python -m pytest -q
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobintel_ci
        run: |
          python - <<'EOF'
          import sqlalchemy as sa
          e = sa.create_engine("postgresql+psycopg2://postgres:postgres@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          e.connect().execute(sa.text("CREATE DATABASE jobintel_ci"))
          EOF
          alembic upgrade head
          alembic check
